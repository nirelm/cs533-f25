<!DOCTYPE html>
<html>
  <body>
    <h2>CORS Test – JSON Response</h2>
    <script>
      fetch('http://localhost:8081/data.json')
        .then(res => res.json())
        .then(data => console.log("Success:", data))
        .catch(err => console.error("Blocked:", err));
    </script>
  </body>
</html>
